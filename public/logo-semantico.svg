<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <!-- Network Diagram Icon -->
  <g transform="translate(10, 5)">
    <!-- Connecting Lines -->
    <line x1="45" y1="42" x2="20" y2="17" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="45" y1="42" x2="72" y2="20" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="42" x2="25" y2="65" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="42" x2="68" y2="68" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Central Node -->
    <circle cx="45" cy="42" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>

    <!-- Top-Left Yellow Accent Node -->
    <circle cx="20" cy="17" r="11" fill="#FFD000" stroke="#000000" stroke-width="4.5"/>

    <!-- Top-Right Small Node -->
    <circle cx="72" cy="20" r="7.5" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>

    <!-- Bottom-Left Small Node -->
    <circle cx="25" cy="65" r="7.5" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>

    <!-- Bottom-Right Medium Node -->
    <circle cx="68" cy="68" r="10.5" fill="#FFFFFF" stroke="#000000" stroke-width="4.5"/>
  </g>

  <!-- Typography: Semântico -->
  <text x="100" y="47" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="39" font-weight="900" fill="#000000" letter-spacing="-0.8">Semântico</text>

  <!-- Yellow Badge Rectangle: Significado e Sentido -->
  <rect x="99" y="53" width="265" height="23" rx="0" fill="#FFD000" />
  <text x="110" y="69" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#111827" letter-spacing="2.2">Significado e Sentido</text>
</svg>
